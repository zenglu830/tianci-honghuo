<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>办公设备租赁服务</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #1f2933;
    background: #f5f7fa;
    line-height: 1.7;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 0 24px; }
  header {
    background: #ffffff;
    border-bottom: 1px solid #e4e8ee;
    padding: 48px 0 40px;
  }
  header h1 { font-size: 30px; letter-spacing: 1px; color: #14532d; }
  header p { margin-top: 12px; color: #52606d; font-size: 16px; }
  section { padding: 40px 0; }
  h2 {
    font-size: 20px;
    color: #14532d;
    padding-left: 12px;
    border-left: 4px solid #15803d;
    margin-bottom: 20px;
  }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
  .card {
    background: #fff;
    border: 1px solid #e4e8ee;
    border-radius: 8px;
    padding: 20px;
  }
  .card h3 { font-size: 16px; margin-bottom: 8px; color: #102a43; }
  .card p { font-size: 14px; color: #616e7c; }
  table { width: 100%; border-collapse: collapse; background: #fff; font-size: 14px; }
  th, td { border: 1px solid #e4e8ee; padding: 12px; text-align: left; }
  th { background: #f0f4f8; font-weight: 600; }
  footer {
    background: #14532d;
    color: #d9e2ec;
    padding: 28px 0;
    font-size: 14px;
    text-align: center;
  }
  footer a { color: #a7f3d0; text-decoration: none; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>办公设备租赁服务</h1>
    <p>复印机 · 打印机 · 复合机 —— 月付租赁，含耗材与上门维护</p>
  </div>
</header>

<div class="wrap">
  <section>
    <h2>服务内容</h2>
    <div class="cards">
      <div class="card"><h3>设备租赁</h3><p>按需选型，月付租金，无需一次性购置设备。</p></div>
      <div class="card"><h3>耗材供应</h3><p>碳粉、硒鼓、纸张按需配送，不占用资金。</p></div>
      <div class="card"><h3>上门维护</h3><p>故障响应、定期保养、设备巡检全部包含。</p></div>
      <div class="card"><h3>灵活扩容</h3><p>业务增长随时加设备，缩减也不浪费。</p></div>
    </div>
  </section>

  <section>
    <h2>租赁与购买对比</h2>
    <table>
      <tr><th>对比项</th><th>直接购买</th><th>租赁</th></tr>
      <tr><td>初期投入</td><td>高</td><td>低</td></tr>
      <tr><td>设备维护</td><td>自己负责</td><td>包含在内</td></tr>
      <tr><td>技术更新</td><td>设备老化后自理</td><td>可换新机型</td></tr>
      <tr><td>按用量付费</td><td>否</td><td>是</td></tr>
    </table>
  </section>

  <section>
    <h2>联系方式</h2>
    <div class="card">
      <p>电话：（待填写）　微信：（待填写）</p>
      <p>服务区域：（待填写）</p>
    </div>
  </section>
</div>

<footer>
  <div class="wrap">办公设备租赁 · 本页面由 GitHub Pages 托管</div>
</footer>
</body>
</html>
